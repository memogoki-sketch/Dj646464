name: DJ64 APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "release/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Android-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Debug-APK bauen
        id: build
        continue-on-error: true
        run: gradle assembleDebug --no-daemon > build.log 2>&1

      - name: Ergebnis im Repository ablegen
        run: |
          mkdir -p release
          rm -f release/DJ64.apk
          grep -E "^e: |error:|FAILED|What went wrong" -A4 build.log | head -100 > release/build-log.txt || true
          echo "Ergebnis: ${{ steps.build.outcome }}" >> release/build-log.txt
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release/DJ64.apk
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A release
          git commit -m "Build-Ergebnis aktualisiert" || exit 0
          git push

      - name: Fehlschlag melden
        if: steps.build.outcome == 'failure'
        run: exit 1
