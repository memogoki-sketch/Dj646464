name: DJ64 APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Android-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DJ64-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: APK im Repository ablegen
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/DJ64.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add release/DJ64.apk
          git commit -m "DJ64.apk aktualisiert" || exit 0
          git push
