plugins {
    id 'com.android.application'
}

android {
    namespace 'com.djergin64.fenerbahcenews'
    compileSdk 34

    defaultConfig {
        applicationId 'com.djergin64.fenerbahcenews'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Keine Fremdbibliotheken: Die App nutzt nur Android-eigene Klassen (WebView).
