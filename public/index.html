<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f4d">
  <meta name="author" content="DjErgin64">
  <title>Fenerbahçe News</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" class="splash" role="presentation">
    <div id="stripes" class="stripes" aria-hidden="true"></div>
    <div class="ball" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="64" height="64">
        <circle cx="32" cy="32" r="29" fill="#fff" stroke="#0a0f1f" stroke-width="3"/>
        <polygon points="32,21 42.5,28.7 38.5,41.1 25.5,41.1 21.5,28.7" fill="#0a0f1f"/>
        <g stroke="#0a0f1f" stroke-width="2.4" stroke-linecap="round">
          <path d="M32 21V5M42.5 28.7l15.2-5M38.5 41.1l9.4 12.7M25.5 41.1l-9.4 12.7M21.5 28.7l-15.2-5"/>
        </g>
      </svg>
    </div>
    <div class="splash-card">
      <div id="splash-title" class="splash-title" aria-label="Fenerbahçe News"></div>
      <div class="splash-credit">design by DjErgin64</div>
    </div>
  </div>

  <header class="top">
    <div class="bar">
      <h1><span class="mark" aria-hidden="true"></span>Fenerbahçe <b>News</b></h1>
      <div class="actions">
        <span id="updated" class="muted" aria-live="polite"></span>
        <button id="refresh" type="button" class="btn" title="Quellen neu laden">Aktualisieren</button>
      </div>
    </div>
    <div class="bar controls">
      <nav id="tabs" class="tabs" aria-label="Sportarten"></nav>
      <div class="tools">
        <div class="views" role="group" aria-label="Ansicht">
          <button type="button" class="view" data-view="cards" title="Karten" aria-label="Kartenansicht">▦</button>
          <button type="button" class="view" data-view="list" title="Liste" aria-label="Listenansicht">☰</button>
          <button type="button" class="view" data-view="gallery" title="Bilder" aria-label="Bildergalerie">🖼</button>
        </div>
        <input id="search" type="search" placeholder="Suchen …" aria-label="Nachrichten durchsuchen">
      </div>
    </div>
    <div class="kit" aria-hidden="true"></div>
  </header>

  <div id="ticker" class="ticker" hidden>
    <span class="tag"><i class="dot"></i>NEU</span>
    <div class="ticker-view"><div id="ticker-track" class="ticker-track"></div></div>
  </div>

  <main>
    <div id="notice" class="notice" hidden></div>
    <section id="fixtures" class="fixtures" hidden aria-label="Spiele">
      <div class="fx-col"><h3>Nächste Spiele</h3><ul id="fx-upcoming"></ul></div>
      <div class="fx-col"><h3>Letzte Ergebnisse</h3><ul id="fx-results"></ul></div>
    </section>
    <section id="hero" class="hero" hidden aria-label="Top-Meldungen"></section>
    <section id="grid" class="grid" aria-live="polite"></section>
    <section id="gallery" class="gallery" hidden aria-label="Bilder"></section>
    <p id="empty" class="empty" hidden>Keine Nachrichten gefunden.</p>
    <div class="more-wrap"><button id="more" type="button" class="btn" hidden>Mehr anzeigen</button></div>
  </main>

  <footer class="foot muted">
    <span>Interne Nutzung · Artikel verlinken auf die Original-Quellen</span>
    <span class="credit">Design by <b>DjErgin64</b></span>
    <button id="status-btn" type="button" class="link">Quellenstatus</button>
  </footer>

  <dialog id="status-dialog">
    <h2>Quellenstatus</h2>
    <ul id="status-list"></ul>
    <form method="dialog"><button class="btn">Schließen</button></form>
  </dialog>

  <dialog id="lightbox" class="lb" aria-label="Bildansicht">
    <div class="lb-stage">
      <button id="lb-prev" type="button" class="lb-nav" aria-label="Vorheriges Bild">‹</button>
      <img id="lb-img" alt="">
      <button id="lb-next" type="button" class="lb-nav" aria-label="Nächstes Bild">›</button>
    </div>
    <div class="lb-info">
      <div>
        <strong id="lb-title"></strong>
        <div id="lb-meta" class="muted"></div>
      </div>
      <div class="lb-actions">
        <a id="lb-open" class="btn" target="_blank" rel="noopener noreferrer">Artikel öffnen</a>
        <button id="lb-close" type="button" class="btn ghost">Schließen</button>
      </div>
    </div>
  </dialog>

  <script src="shared/rss.js"></script>
  <script src="shared/classify.js"></script>
  <script src="shared/fixtures.js"></script>
  <script src="shared/engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
